name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# A push that supersedes another on the same branch cancels it. Two runs of one
# branch in flight produce two 105 MB artifacts of which nobody wants the older,
# and the quota does not care that it was about to be replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Deleting our own older artifacts. Nothing else here writes.
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # One line now, and that is the point of the upgrade rather than an
          # oversight — see docs/DESIGN-net10-upgrade.md.
          #
          # The solution targets net10.0 throughout, so the SDK that builds it
          # carries the runtime that runs it and there is nothing left to
          # declare separately. This used to name 8.0.x as well, because a
          # net8.0 test assembly does not roll forward onto a 10.0 runtime
          # (RollForward defaults to Minor, which will not cross a major
          # version) — so the 10.0 SDK alone compiled everything and then ran
          # not one test. B53 was that dependency being inherited from the
          # ubuntu-latest image rather than declared here; moving the TFM
          # retires the requirement instead of declaring it.
          dotnet-version: 10.0.x
      - name: SkiaSharp native dependency
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1
      - run: dotnet test Lightbox.sln -c Release

  # Is there anything in this push that could change the bundle? A Windows
  # build of a Markdown edit is 105 MB of storage for a file nobody ships.
  # Tests still run on everything — it is only the bundle that is skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A new branch, a force push or a first run has no usable base.
          # Build in that case: skipping a bundle somebody wanted is a worse
          # failure than storing one they did not.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref — building"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          printf '%s\n' "$CHANGED"
          # Anything that is not documentation counts as code.
          if printf '%s\n' "$CHANGED" | grep -qvE '^(docs/|\.claude/)|^[^/]*\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only — skipping the Windows bundle"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  publish-win-x64:
    runs-on: ubuntu-latest
    needs: [test, changes]
    # Two conditions. The first skips documentation-only pushes. The second
    # drops the duplicate bundle a pull request from this repo would otherwise
    # produce — `push` and `pull_request` both fire, and because a PR's SHA is
    # the merge commit the two artifacts get different names and neither
    # replaces the other. A fork's PR is still built, because no push event
    # here ever covers it.
    if: >
      (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'pull_request'
       || github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish app (self-contained, no install/admin needed)
        run: >
          dotnet publish src/Lightbox.App/Lightbox.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishTrimmed=false -p:DebugType=none
          -o publish/win-x64
      # Into the SAME folder as the app, not a subfolder — that is B32's fix and
      # it is the net10.0 upgrade that made it possible. A self-contained app
      # only looks for its runtime beside its own executable, so `mcp/` could
      # never reach the parent's copy and had to carry a second one: 35.3 MB of
      # a 105 MB bundle. While the app was net8.0 and the server net10.0 those
      # two copies were genuinely different files and merging them would have
      # broken whichever executable lost. Both are net10.0 now, so the runtime
      # files are byte-identical, the second publish overwrites them with the
      # same bytes, and the two deps.json/runtimeconfig.json pairs have distinct
      # names and coexist. Measured: the server adds 4 MB instead of 35.3, and
      # the bundle drops from 105 MB zipped to 74.
      - name: Publish MCP server into the same bundle
        run: >
          dotnet publish src/Lightbox.Mcp/Lightbox.Mcp.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishTrimmed=false -p:DebugType=none
          -o publish/win-x64
      # The artifact (= downloaded zip) name says what kind of build this is:
      #   release-main-…      build of main, for release-style testing
      #   bugfix-<branch>-…   build of a fix/, bugfix/ or hotfix/ branch
      #   branch-<branch>-…   any other feature/work branch
      # plus the short commit SHA so builds of the same branch stay distinguishable.
      - name: Artifact designation
        id: designation
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$BRANCH" in
            main)                    KIND="release" ;;
            fix/*|bugfix/*|hotfix/*) KIND="bugfix" ;;
            *)                       KIND="branch" ;;
          esac
          SAFE=$(printf '%s' "$BRANCH" | tr '/ _' '---' | tr -cd 'A-Za-z0-9.-')
          echo "prefix=Lightbox-win-x64-${KIND}-${SAFE}-" >> "$GITHUB_OUTPUT"
          echo "name=Lightbox-win-x64-${KIND}-${SAFE}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ---- keep the quota from filling ------------------------------------------
      #
      # One bundle is ~105 MB zipped, so `retention-days` alone cannot hold the
      # line: retention is time-based and the accumulation here is per-push.
      #
      # It runs BEFORE the upload on purpose. Pruning afterwards deadlocks —
      # once the quota is full the upload fails, and the step that would have
      # freed the space never runs.
      #
      # The policy lives in .github/scripts/prune-artifacts.sh so the cleanup
      # button runs exactly the same rules. HEADROOM_MB is the one thing only
      # this caller wants: leave room for the bundle about to be uploaded.
      - name: Prune older artifacts before uploading
        continue-on-error: true       # never fail a build over housekeeping
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 3
          STALE_DAYS: 7
          # 400, not 1500. A Free personal account's whole artifact allowance
          # is 500 MB; Pro is 2 GB. A budget above the ceiling never fires, so
          # this is sized for the smaller plan — raise it to ~1500 on Pro.
          BUDGET_MB: 400
          HEADROOM_MB: 200
        shell: bash
        run: bash .github/scripts/prune-artifacts.sh

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.designation.outputs.name }}
          path: publish/win-x64
          # Work builds are throwaway; only main's are worth keeping around.
          #
          # compression-level is left at its default deliberately. Measured on
          # this bundle: 104.8 MB at level 6 against 104.4 MB at level 9,
          # because it is already compressed DLLs and native libraries.
          # Raising it costs CPU on every run to save 0.4%.
          retention-days: ${{ github.ref_name == 'main' && 30 || 5 }}
