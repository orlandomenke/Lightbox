name: build

# One run per change, and the branch filter is the whole of it.
#
# `push:` with no filter fires on every branch, and `pull_request:` fires again
# on the same commit the moment a PR is open — so one `git push` ran the entire
# suite twice. Measured on PR #5: two `test` jobs and two `changes` jobs, in
# runs 31003188351 and 31003161817, for a single push.
#
# The concurrency group below does not deduplicate them, and the reason is worth
# writing down because it looks like it should. For a push `head_ref` is empty
# so the group is `build-refs/heads/<branch>`; for a pull_request it is
# `build-<branch>`. Two different strings, two groups, neither cancels the
# other.
#
# So: pushes are watched only on the default branch, which is where a merge
# lands and the one place no PR event covers. Everything else is covered by the
# PR. A branch with no PR open therefore runs nothing until one is opened, or
# until somebody presses **Run workflow**.
#
# This workflow no longer produces a Windows bundle. That moved to release.yml,
# which builds one on a `v*` tag or on request — see the comment at the top of
# that file for why a per-push artifact was the wrong shape for a download.
#
# **A draft pull request builds nothing.** That is the remaining trigger and it
# was the expensive one: `pull_request` fires on every push to an open PR, so a
# branch that is merged with main twice and has its index rebuilt costs a full
# suite each time. Open the PR as a draft while that is happening and mark it
# ready when it is worth checking.
#
# `ready_for_review` is in the type list for that reason, and it is the part that
# is easy to leave out: the default types are `opened`, `synchronize` and
# `reopened`, none of which fire when a draft is marked ready — so without it a
# PR drafted and then readied would never build at all.
#
# The condition itself is on every job rather than in one place, because Actions
# has no workflow-level `if`. It reads
# `github.event_name != 'pull_request' || github.event.pull_request.draft == false`,
# and the first half is load-bearing: `draft` exists only on a pull_request
# event, so testing it alone would be comparing an empty string to `false` and
# would skip the merge build on main.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A push that supersedes another on the same branch cancels it. Two runs of one
# branch in flight produce two 105 MB artifacts of which nobody wants the older,
# and the quota does not care that it was about to be replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Nothing here writes. Building a bundle moved to release.yml, which is the
  # only workflow that needs more than read — and it asks for contents: write
  # only because a Release has to be created.

jobs:
  # ---------------------------------------------------------------------------
  # The suite, as several legs running at once.
  #
  # MEASURED 2026-09-12, Release, 4 cores: Core 6 s, Ai 4 s, Raster 125 s,
  # App 557 s — 742 s in total, of which Lightbox.App.Tests is 75%. One serial
  # `dotnet test Lightbox.sln` therefore spends three quarters of its wall clock
  # in a single process, and Q189 records why that decides the shape here.
  #
  # Two things had to be true at once, and neither is the obvious one:
  #
  #   * **Selecting by what changed is the weak lever, not the strong one.**
  #     Lightbox.App.Tests references Core, Raster, Ai, Import and Mcp, so a
  #     sound rule can skip it only for a change touching none of them. It is
  #     kept because it is nearly free once the matrix exists, not because it is
  #     where the time goes.
  #   * **The expensive assembly is one process, and no in-process setting
  #     fixes that.** `HeadlessSessionSerialisation.cs` turns collection
  #     parallelism off assembly-wide (B93), and most of its classes are
  #     `[AvaloniaFact]` classes that serialise on the headless dispatcher
  #     whatever xUnit is told. Splitting across *runners* is the only split
  #     that sidesteps both — and it sidesteps B93's own mechanism, because two
  #     headless sessions on two machines cannot race each other.
  #
  # `scripts/testplan.py` owns both decisions. The rules are NOT duplicated into
  # this file: a filter written twice is a filter that disagrees with itself,
  # and the copy in YAML is the one with no selftest. It has one, CI runs it,
  # and `PlanGateTests` asserts this workflow reads its plan from the script.
  #
  # THE SAFETY PROPERTY, because a skipped test looks exactly like a passing
  # one and B269/B281 are what that costs: the shard filters **partition** each
  # assembly — the last shard is the complement of the others, so a class the
  # planner never enumerated still runs — and every leg proves it ran its whole
  # slice with `testcount.py verify`, which evaluates the filter itself rather
  # than trusting VSTest to agree about it.
  # ---------------------------------------------------------------------------
  test:
    # A ceiling well above the real cost and far below GitHub's default of six
    # hours. The step below has its own five-minute guard for the hang that
    # prompted this; this is the general form of it, because the next hang will
    # be somewhere else. Six hours of a cancelled-by-hand job tells nobody
    # anything and holds a runner the whole time — PR #358 sat like that for
    # over half an hour before anyone noticed.
    #
    # Lower than it was: a leg is a slice, and the whole suite no longer runs in
    # one job. The slowest leg is ~140 s.
    timeout-minutes: 20
    needs: changes
    # Draft PRs build nothing (see the `on:` block); beyond that, this runs only
    # what the change can reach, which for a documentation-only change is
    # nothing at all. The job is skipped rather than removed, so it still
    # reports a conclusion and a required-check rule has something to read —
    # though `suite` below is the check worth requiring now that this one fans
    # out.
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && needs.changes.outputs.any == 'true'
    strategy:
      # One leg failing must not cancel the others. A red shard is a fact about
      # that shard; cancelling its siblings turns one failure into seven
      # unknowns and costs a whole round trip to learn the rest.
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.changes.outputs.plan) }}
    name: test ${{ matrix.leg.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # One line now, and that is the point of the upgrade rather than an
          # oversight — see docs/DESIGN-net10-upgrade.md.
          #
          # The solution targets net10.0 throughout, so the SDK that builds it
          # carries the runtime that runs it and there is nothing left to
          # declare separately. This used to name 8.0.x as well, because a
          # net8.0 test assembly does not roll forward onto a 10.0 runtime
          # (RollForward defaults to Minor, which will not cross a major
          # version) — so the 10.0 SDK alone compiled everything and then ran
          # not one test. B53 was that dependency being inherited from the
          # ubuntu-latest image rather than declared here; moving the TFM
          # retires the requirement instead of declaring it.
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keyed on the project files rather than a lock file, because this
          # repo has none — `setup-dotnet`'s own `cache: true` needs a
          # packages.lock.json and fails with "unable to cache dependencies"
          # without one. Hashing the csproj set plus Directory.Build.props gets
          # the same effect: the key moves exactly when a dependency or a target
          # framework does.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          # A partial hit still saves most of the download: the restore only
          # fetches what changed rather than the whole graph.
          restore-keys: nuget-${{ runner.os }}-
      # SkiaSharp's native library links against libfontconfig, so the suite
      # cannot render a glyph without it.
      #
      # **Bounded, and skipped when it is already there.** This was
      # `apt-get update && apt-get install -y libfontconfig1`, unbounded, and on
      # 2026-08-19 it hung for twelve minutes and took the job down with it: the
      # Azure mirror the runner prefers went unreachable, every index line came
      # back `Ign:`, and apt retried without a deadline until the whole run was
      # cancelled. Nothing was wrong with the build — CI simply stopped
      # answering, which is worse than failing, because a cancelled job tells
      # you nothing about the code.
      #
      # Three things stop that recurring, in order of who catches it first:
      # the presence check (the runner image usually ships this package, so the
      # common path touches the network not at all), the retry and timeout
      # options (a dead mirror becomes a fast move to the next one rather than
      # an open-ended wait), and `timeout-minutes` as the backstop that turns
      # any remaining hang into a red job in five minutes instead of a
      # cancellation in thirty.
      #
      # `apt-get update` is allowed to fail. Its job is to freshen indexes that
      # are usually fresh already; the install below is what actually has to
      # work, and it is what reports if it cannot.
      - name: SkiaSharp native dependency
        timeout-minutes: 5
        run: |
          if ldconfig -p | grep -q 'libfontconfig\.so\.1'; then
            echo "libfontconfig1 already present in the runner image — nothing to do"
            exit 0
          fi
          sudo apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 || echo "apt-get update did not complete; installing from the indexes we have"
          sudo apt-get install -y --no-install-recommends libfontconfig1

      # The leg works out its own filter rather than being handed one. The
      # complement shard's expression is 25 KB on its own, and carrying six of
      # those through a matrix would put a quarter of a megabyte into a workflow
      # expression context for nothing — the checkout is the same tree the plan
      # was made from, so recomputing gives the same answer by construction.
      #
      # Written to a file, not an output: it contains `|` and `&` and is far too
      # long to want anywhere near a shell interpolation.
      - name: Work out this leg's slice
        id: slice
        run: |
          python3 scripts/testplan.py filter \
            "${{ matrix.leg.project }}" "${{ matrix.leg.shard }}" > /tmp/leg.filter
          echo "$(wc -c < /tmp/leg.filter) bytes of filter for ${{ matrix.leg.name }}"

      # `--logger trx` writes the per-test record the guard below reads. Console
      # output is unchanged; the trx rides alongside it.
      #
      # B281: the App suite once grew a 14.4 GB heap of leaked per-test object
      # graphs and OOM-killed 16 GB runners from below — the "canceled with no
      # output" wedge. The leaks are fixed and guarded (ViewModelRetentionTests),
      # and this cap is the backstop: the fixed suite runs green and FASTER
      # under 4 GB, so 6 GB is pure headroom — and a future regression then dies
      # in-process as a named OutOfMemoryException the count guard reds, instead
      # of taking the runner down with nothing in the log.
      #
      # The filter comes in through the environment rather than the command
      # line so that nothing in it is ever seen by a shell as syntax.
      - name: Run this leg
        env:
          DOTNET_GCHeapHardLimit: "0x180000000"
        run: |
          # A `build` leg is a project nothing tests. `dotnet test Lightbox.sln`
          # compiled the whole solution as a side effect and these per-project
          # legs do not, so a project outside every test's closure would stop
          # being built at all and a compile error in it would reach main with
          # every check green. `tools/Lightbox.Bench` is that project today;
          # testplan.py derives the list rather than naming it.
          if [ "${{ matrix.leg.kind }}" = "build" ]; then
            dotnet build "${{ matrix.leg.csproj }}" -c Release
            exit 0
          fi

          LEG_FILTER=$(cat /tmp/leg.filter)
          if [ -n "$LEG_FILTER" ]; then
            dotnet test "${{ matrix.leg.csproj }}" -c Release --logger trx --filter "$LEG_FILTER"
          else
            dotnet test "${{ matrix.leg.csproj }}" -c Release --logger trx
          fi

      # B269/B281: a run has been seen executing hundreds fewer App tests than
      # exist and still printing `Passed!` with exit 0 — and a killed host prints
      # `Passed!` too, one line after `Catastrophic failure`. So the summary line
      # is not evidence that the suite ran. This compares the NAMES this leg
      # reported against the names discovery finds on the same binaries, narrowed
      # to the slice this leg was asked for, and reds the job on any test that
      # went missing — or on any that ran which the filter excludes, which would
      # mean VSTest and the planner disagree and the shards are not a partition.
      - name: Every test in this leg ran
        if: matrix.leg.kind == 'test'
        run: |
          python3 scripts/testcount.py verify -c Release \
            --project "${{ matrix.leg.project }}" \
            --filter "$(cat /tmp/leg.filter)"

  # ---------------------------------------------------------------------------
  # One conclusion for a fan of legs.
  #
  # A matrix reports one check per leg — `test (Lightbox.App.Tests 3/6)` and so
  # on — and those names move whenever the shard counts do, which makes them
  # hopeless as required checks. **This is the check to require**: it is one
  # name, it never moves, and it is red unless every planned leg was green.
  #
  # `always()` is the whole point: without it a failed or skipped `test` would
  # skip this too, and a skipped required check is a green tick nobody earned.
  # ---------------------------------------------------------------------------
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, test]
    if: >
      always()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Every leg the plan asked for came back green
        run: |
          PLANNED='${{ needs.changes.outputs.any }}'
          RESULT='${{ needs.test.result }}'
          PLANNER='${{ needs.changes.result }}'
          echo "planner result:     $PLANNER"
          echo "plan wanted tests:  $PLANNED"
          echo "test matrix result: $RESULT"

          # The planner failing is the subtlest way this job could lie. A failed
          # `changes` leaves its outputs empty, which reads identically to "this
          # change reaches no tests" — so without this the one check a branch
          # rule requires would go green precisely when nothing was planned at
          # all. Checked first, before the empty output is interpreted.
          if [ "$PLANNER" != "success" ]; then
            echo "::error::the planner reported '$PLANNER', so nothing decided what to run"
            exit 1
          fi

          if [ "$PLANNED" != "true" ]; then
            # Nothing in this change can reach a test. The `docs` job still ran,
            # which is the point of it being separate.
            echo "nothing to test — no leg was planned"
            exit 0
          fi

          # `success` is the only acceptable answer. `skipped` is NOT: it means
          # the legs never ran despite a plan that wanted them, which is the
          # failure this job exists to make visible rather than silent.
          if [ "$RESULT" != "success" ]; then
            echo "::error::the test matrix reported '$RESULT' — the suite did not pass"
            exit 1
          fi
          echo "every planned leg passed"

  # The derived documentation checks, and the script gates that need no .NET.
  #
  # A SEPARATE job rather than a step in `test`, and the reason is the `if:`
  # above it: `test` is skipped when a push touches only docs/ and .claude/ —
  # which is precisely when the manual's contents list drifts. A check that
  # cannot run on a documentation-only change is not a check on documentation.
  #
  # It is also where the Python selftests live, which is new: they used to sit
  # in `test`, and `test` is now a matrix, so leaving them there would have run
  # each of them eight times to learn the same thing.
  #
  # No .NET and no checkout depth needed, so it costs a few seconds and runs on
  # everything a draft PR does not.
  #
  # **That exception is a real cost and worth naming**, because this is the
  # cheapest job here and the one that catches the failure a merge introduces.
  # Skipping it on drafts means a draft can carry two bugs with the same id until
  # it is marked ready. It is deliberate — the rule is "a draft builds nothing",
  # and a rule with one exception is a rule nobody remembers — but if duplicate
  # ids start reaching main again, this line is why, and letting `docs` alone run
  # on drafts is the fix.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - name: The manual's contents list matches its sections
        run: python3 scripts/manual.py check

      # The ledgers, for the one failure a merge can introduce that nothing else
      # would notice: two ids the same. `bugs.py` grew `duplicate_ids` when two
      # bugs shared B39, and B81 is the same fault in QUESTIONS.md.
      #
      # A merge is exactly how it happens. Two branches each take the next free
      # id, both are right on their own branch, and the collision only exists in
      # the merged file. The ledgers are deliberately NOT auto-merged (see
      # .gitattributes), so a person resolves that conflict — and this is what
      # tells them they got it wrong.
      #
      # THIS STEP IS THE SECOND LINE, NOT THE FIRST. It was the only one until
      # 2026-08-07, when four ids collided across two merges with it green the
      # whole time — because a collision reaches CI only after it is pushed, and
      # by then other branches have rebased onto the bad resolution. The first
      # line is now `.githooks/pre-push`, which runs `bugs.py ids` before the
      # push. This still matters: it sees a push that bypassed the hook, and a
      # merge performed by GitHub itself, where no hook runs at all.
      #
      # `check` also reports an entry that a merge parent had and this tree does
      # not — the failure the duplicate check structurally cannot see, because
      # taking one side of the conflict leaves a perfectly consistent file.
      - name: The bug ledger is consistent and its ids are unique
        run: python3 scripts/bugs.py check
      # The questions are one file each (Q92) and the ledger gate reads their ids
      # from the filenames, so a file whose name and heading disagree carries an
      # id that nothing checks. That is the only new way this shape can rot.
      - name: Every question file is named for the question in it
        run: python3 scripts/questions.py check
      - name: The roadmap's checkboxes match the code
        run: python3 scripts/roadmap.py check

      # CLAUDE.md is loaded into every session and again into every subagent, so
      # a paragraph added to it is paid once per agent per session, forever. It
      # reached 37,909 characters before anything measured that, half of it in
      # two sections. The ratchet holds the line; the rule it enforces is that a
      # rule stays resident and the incident that produced it moves to a skill.
      - name: The per-session prelude is within its budget
        run: python3 scripts/prelude.py check

      # The generated index is untracked (2026-08-08, Q55): committing it made
      # every pair of parallel branches conflict by construction, and GitHub
      # runs no merge driver, so every open PR went red the moment any other
      # one merged. With nothing committed there is nothing to drift and
      # nothing to verify — building proves the whole tree still parses, which
      # is the half of the old `verify` that still means something.
      #
      # Safe in a shallow checkout — unlike HOTSPOTS.md, these two are derived
      # from file contents only and carry no commit stamp, on purpose.
      - name: The index builds from this tree
        run: python3 scripts/codemap.py build

      # ---- the script gates, none of which need a compiler -------------------
      #
      # The branch-name rules in branchstate.py have no C# suite to live in, and
      # a heuristic with no test is how the first version came to fire on
      # `chore/ledger-by-domain`. Costs a second.
      - name: Branch-name rules
        run: python3 scripts/branchstate.py selftest
      # B264. The ledger repair builds two clashing branches in a throwaway
      # repository and proves it stands down mid-merge. Here rather than in a C#
      # suite for branchstate's reason — the rules have none to live in — and it
      # costs about a second.
      - name: Ledger id repair
        run: python3 scripts/bugs.py selftest
      # The count guard's own shortfall detection, fed synthetic drops — kept
      # honest the same way branchstate and bugs are.
      - name: Count-guard rules
        run: python3 scripts/testcount.py selftest
      # The selection and shard rules, which decide what CI runs at all. A
      # planner with no test is the one component here that can fail by being
      # too quiet, so this is the least optional of the four.
      - name: Test-plan rules
        run: python3 scripts/testplan.py selftest
      # And the half a selftest cannot cover: that the rules still describe the
      # tests as they are now. This resolves the repo paths the suite actually
      # opens and fails if one of them is classified as something CI would skip
      # — PR #95's failure, where a README-only change skipped the only test
      # reading the README, generalised so the next one fails a build instead of
      # needing to be noticed.
      - name: The plan covers what the tests read
        run: python3 scripts/testplan.py audit

  # What can this change reach, and how should it be split?
  #
  # A Release build and 4 400 App tests for a Markdown edit is time spent on a
  # file no test can read, and running Raster's 125 s for an App-only change is
  # the same mistake one size down. This job answers both questions at once and
  # emits the matrix `test` fans out over.
  #
  # It is a `git diff` and a script, and costs about five seconds, so the
  # serialisation in front of `test` is cheaper than what it saves.
  #
  # **The rules are in `scripts/testplan.py`, not here.** The old version of
  # this job carried a `grep -qvE` of path patterns, and that is exactly the
  # shape that rots: no selftest, no way to ask it a question, and a second
  # opinion about what counts as documentation living in YAML where nobody
  # looks. `PlanGateTests` asserts this stays true.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A draft builds nothing, and this is where that has to be said as well as on
    # the jobs that need it: `test` and `suite` read `needs.changes.outputs`, so
    # a skipped `changes` would leave them reading an empty string. They carry
    # the condition too rather than relying on that, because "it happens to
    # evaluate false" is not the same as "it is switched off".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A new branch, a force push, a first run or a manual dispatch has no
          # usable base. Test everything in that case: skipping a suite somebody
          # needed is a worse failure than running one they did not, and that
          # judgement is older than this job.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "no usable base ref — planning the whole suite"
            python3 scripts/testplan.py plan --github
            exit 0
          fi

          git diff --name-only "$BASE" "$GITHUB_SHA" | tee /tmp/changed.txt
          # `--github` writes the matrix to GITHUB_OUTPUT and prints the
          # reasoning to the log, so one call does both.
          python3 scripts/testplan.py plan --changed-files /tmp/changed.txt --github
