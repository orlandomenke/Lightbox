name: build

# One run per change, and the branch filter is the whole of it.
#
# `push:` with no filter fires on every branch, and `pull_request:` fires again
# on the same commit the moment a PR is open — so one `git push` ran the entire
# suite twice. Measured on PR #5: two `test` jobs and two `changes` jobs, in
# runs 31003188351 and 31003161817, for a single push.
#
# The concurrency group below does not deduplicate them, and the reason is worth
# writing down because it looks like it should. For a push `head_ref` is empty
# so the group is `build-refs/heads/<branch>`; for a pull_request it is
# `build-<branch>`. Two different strings, two groups, neither cancels the
# other.
#
# So: pushes are watched only on the default branch, which is where a merge
# lands and the one place no PR event covers. Everything else is covered by the
# PR. A branch with no PR open therefore runs nothing until one is opened, or
# until somebody presses **Run workflow**.
#
# This workflow no longer produces a Windows bundle. That moved to release.yml,
# which builds one on a `v*` tag or on request — see the comment at the top of
# that file for why a per-push artifact was the wrong shape for a download.
#
# **A draft pull request builds nothing.** That is the remaining trigger and it
# was the expensive one: `pull_request` fires on every push to an open PR, so a
# branch that is merged with main twice and has its index rebuilt costs a full
# suite each time. Open the PR as a draft while that is happening and mark it
# ready when it is worth checking.
#
# `ready_for_review` is in the type list for that reason, and it is the part that
# is easy to leave out: the default types are `opened`, `synchronize` and
# `reopened`, none of which fire when a draft is marked ready — so without it a
# PR drafted and then readied would never build at all.
#
# The condition itself is on every job rather than in one place, because Actions
# has no workflow-level `if`. It reads
# `github.event_name != 'pull_request' || github.event.pull_request.draft == false`,
# and the first half is load-bearing: `draft` exists only on a pull_request
# event, so testing it alone would be comparing an empty string to `false` and
# would skip the merge build on main.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A push that supersedes another on the same branch cancels it. Two runs of one
# branch in flight produce two 105 MB artifacts of which nobody wants the older,
# and the quota does not care that it was about to be replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Nothing here writes. Building a bundle moved to release.yml, which is the
  # only workflow that needs more than read — and it asks for contents: write
  # only because a Release has to be created.

jobs:
  # `changes` first, because `test` now asks it whether there is anything to
  # test. It is a git diff and costs about five seconds, so the serialisation
  # is cheaper than the four minutes it saves on a documentation-only change.
  test:
    runs-on: ubuntu-latest
    # A ceiling well above the real cost (~15 min) and far below GitHub's
    # default of six hours. The step below has its own five-minute guard for
    # the hang that prompted this; this is the general form of it, because the
    # next hang will be somewhere else. Six hours of a cancelled-by-hand job
    # tells nobody anything and holds a runner the whole time — PR #358 sat
    # like that for over half an hour before anyone noticed.
    timeout-minutes: 45
    needs: changes
    # Nothing in the suite reads docs/ or .claude/ — checked, not assumed: the
    # only repo files any test opens are .github/workflows/build.yml and
    # Lightbox.App.csproj, both read by CiRuntimeTests, and both count as *code*
    # under the filter below. So a workflow edit still runs the tests written to
    # guard workflow edits, while a BUGS.md edit does not run 2451 tests that
    # cannot see it.
    #
    # The job is skipped rather than removed, so it still reports a conclusion
    # and a required-check rule has something to read.
    # Draft PRs build nothing (see the `on:` block); beyond that, a
    # documentation-only change skips the suite it cannot affect.
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # One line now, and that is the point of the upgrade rather than an
          # oversight — see docs/DESIGN-net10-upgrade.md.
          #
          # The solution targets net10.0 throughout, so the SDK that builds it
          # carries the runtime that runs it and there is nothing left to
          # declare separately. This used to name 8.0.x as well, because a
          # net8.0 test assembly does not roll forward onto a 10.0 runtime
          # (RollForward defaults to Minor, which will not cross a major
          # version) — so the 10.0 SDK alone compiled everything and then ran
          # not one test. B53 was that dependency being inherited from the
          # ubuntu-latest image rather than declared here; moving the TFM
          # retires the requirement instead of declaring it.
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keyed on the project files rather than a lock file, because this
          # repo has none — `setup-dotnet`'s own `cache: true` needs a
          # packages.lock.json and fails with "unable to cache dependencies"
          # without one. Hashing the csproj set plus Directory.Build.props gets
          # the same effect: the key moves exactly when a dependency or a target
          # framework does.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          # A partial hit still saves most of the download: the restore only
          # fetches what changed rather than the whole graph.
          restore-keys: nuget-${{ runner.os }}-
      # SkiaSharp's native library links against libfontconfig, so the suite
      # cannot render a glyph without it.
      #
      # **Bounded, and skipped when it is already there.** This was
      # `apt-get update && apt-get install -y libfontconfig1`, unbounded, and on
      # 2026-08-19 it hung for twelve minutes and took the job down with it: the
      # Azure mirror the runner prefers went unreachable, every index line came
      # back `Ign:`, and apt retried without a deadline until the whole run was
      # cancelled. Nothing was wrong with the build — CI simply stopped
      # answering, which is worse than failing, because a cancelled job tells
      # you nothing about the code.
      #
      # Three things stop that recurring, in order of who catches it first:
      # the presence check (the runner image usually ships this package, so the
      # common path touches the network not at all), the retry and timeout
      # options (a dead mirror becomes a fast move to the next one rather than
      # an open-ended wait), and `timeout-minutes` as the backstop that turns
      # any remaining hang into a red job in five minutes instead of a
      # cancellation in thirty.
      #
      # `apt-get update` is allowed to fail. Its job is to freshen indexes that
      # are usually fresh already; the install below is what actually has to
      # work, and it is what reports if it cannot.
      - name: SkiaSharp native dependency
        timeout-minutes: 5
        run: |
          if ldconfig -p | grep -q 'libfontconfig\.so\.1'; then
            echo "libfontconfig1 already present in the runner image — nothing to do"
            exit 0
          fi
          sudo apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 || echo "apt-get update did not complete; installing from the indexes we have"
          sudo apt-get install -y --no-install-recommends libfontconfig1
      - run: dotnet test Lightbox.sln -c Release
      # The branch-name rules in branchstate.py have no C# suite to live in, and
      # a heuristic with no test is how the first version came to fire on
      # `chore/ledger-by-domain`. Costs a second.
      - name: Branch-name rules
        run: python3 scripts/branchstate.py selftest

  # The derived documentation checks.
  #
  # A SEPARATE job rather than a step in `test`, and the reason is the `if:`
  # above it: `test` is skipped when a push touches only docs/ and .claude/ —
  # which is precisely when the manual's contents list drifts. A check that
  # cannot run on a documentation-only change is not a check on documentation.
  #
  # No .NET and no checkout depth needed, so it costs a few seconds and runs on
  # everything a draft PR does not.
  #
  # **That exception is a real cost and worth naming**, because this is the
  # cheapest job here and the one that catches the failure a merge introduces.
  # Skipping it on drafts means a draft can carry two bugs with the same id until
  # it is marked ready. It is deliberate — the rule is "a draft builds nothing",
  # and a rule with one exception is a rule nobody remembers — but if duplicate
  # ids start reaching main again, this line is why, and letting `docs` alone run
  # on drafts is the fix.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
      - name: The manual's contents list matches its sections
        run: python3 scripts/manual.py check

      # The ledgers, for the one failure a merge can introduce that nothing else
      # would notice: two ids the same. `bugs.py` grew `duplicate_ids` when two
      # bugs shared B39, and B81 is the same fault in QUESTIONS.md.
      #
      # A merge is exactly how it happens. Two branches each take the next free
      # id, both are right on their own branch, and the collision only exists in
      # the merged file. The ledgers are deliberately NOT auto-merged (see
      # .gitattributes), so a person resolves that conflict — and this is what
      # tells them they got it wrong.
      #
      # THIS STEP IS THE SECOND LINE, NOT THE FIRST. It was the only one until
      # 2026-08-07, when four ids collided across two merges with it green the
      # whole time — because a collision reaches CI only after it is pushed, and
      # by then other branches have rebased onto the bad resolution. The first
      # line is now `.githooks/pre-push`, which runs `bugs.py ids` before the
      # push. This still matters: it sees a push that bypassed the hook, and a
      # merge performed by GitHub itself, where no hook runs at all.
      #
      # `check` also reports an entry that a merge parent had and this tree does
      # not — the failure the duplicate check structurally cannot see, because
      # taking one side of the conflict leaves a perfectly consistent file.
      - name: The bug ledger is consistent and its ids are unique
        run: python3 scripts/bugs.py check
      # The questions are one file each (Q92) and the ledger gate reads their ids
      # from the filenames, so a file whose name and heading disagree carries an
      # id that nothing checks. That is the only new way this shape can rot.
      - name: Every question file is named for the question in it
        run: python3 scripts/questions.py check
      - name: The roadmap's checkboxes match the code
        run: python3 scripts/roadmap.py check

      # The generated index is untracked (2026-08-08, Q55): committing it made
      # every pair of parallel branches conflict by construction, and GitHub
      # runs no merge driver, so every open PR went red the moment any other
      # one merged. With nothing committed there is nothing to drift and
      # nothing to verify — building proves the whole tree still parses, which
      # is the half of the old `verify` that still means something.
      #
      # Safe in a shallow checkout — unlike HOTSPOTS.md, these two are derived
      # from file contents only and carry no commit stamp, on purpose.
      - name: The index builds from this tree
        run: python3 scripts/codemap.py build

  # Is there anything in this push that could need testing? A Release build and
  # 2451 tests for a Markdown edit is four minutes spent on a file no test can
  # read. The docs job still runs on everything, which is the point of it being
  # separate — a documentation change is exactly when the derived contents list
  # and the ledger ids need checking.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A draft builds nothing, and this is where that has to be said as well as on
    # the jobs that need it: `test` and `publish-win-x64` read
    # `needs.changes.outputs.code`, so a skipped `changes` would leave them
    # reading an empty string. They carry the condition too rather than relying on
    # that, because "it happens to evaluate false" is not the same as "it is
    # switched off".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A new branch, a force push or a first run has no usable base.
          # Test in that case: skipping a suite somebody needed is a worse
          # failure than running one they did not.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref — building"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          printf '%s\n' "$CHANGED"

          # Some documents are test inputs, and those are code however they are
          # spelled. `PublishLayoutTests` reads README.md and MANUAL_TESTING.md
          # to check they still name the folder the MCP server ships in — a
          # string whose being wrong produces silence rather than an error, which
          # is precisely why it is asserted rather than trusted.
          #
          # Without this line the rule below classified them as documentation and
          # skipped the only test guarding them, so the one change most likely to
          # break that assertion was the one change that never ran it. Caught on
          # PR #95, a README-only change, where `test` reported `skipped`.
          #
          # If a test starts reading another document, it belongs here — and
          # `PublishLayoutTests` asserts this list covers the ones it reads, so
          # the omission fails a build rather than quietly widening the hole.
          if printf '%s\n' "$CHANGED" | grep -qE '^(README\.md|MANUAL_TESTING\.md)$'; then
            echo "a document the suite reads changed — building"
            echo "code=true" >> "$GITHUB_OUTPUT"
          # Anything else that is not documentation counts as code.
          elif printf '%s\n' "$CHANGED" | grep -qvE '^(docs/|\.claude/)|^[^/]*\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only — skipping the test suite"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

