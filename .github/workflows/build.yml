name: build

# One run per change, and the branch filter is the whole of it.
#
# `push:` with no filter fires on every branch, and `pull_request:` fires again
# on the same commit the moment a PR is open — so one `git push` ran the entire
# suite twice. Measured on PR #5: two `test` jobs and two `changes` jobs, in
# runs 31003188351 and 31003161817, for a single push.
#
# The concurrency group below does not deduplicate them, and the reason is worth
# writing down because it looks like it should. For a push `head_ref` is empty
# so the group is `build-refs/heads/<branch>`; for a pull_request it is
# `build-<branch>`. Two different strings, two groups, neither cancels the
# other.
#
# So: pushes are watched only on the default branch, which is where a merge
# lands and the one place no PR event covers. Everything else is covered by the
# PR. The cost is that a branch with no PR open builds no bundle — use the
# **Run workflow** button, which `workflow_dispatch` keeps available and which
# always builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that supersedes another on the same branch cancels it. Two runs of one
# branch in flight produce two 105 MB artifacts of which nobody wants the older,
# and the quota does not care that it was about to be replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Deleting our own older artifacts. Nothing else here writes.
  actions: write

jobs:
  # `changes` first, because `test` now asks it whether there is anything to
  # test. It is a git diff and costs about five seconds, so the serialisation
  # is cheaper than the four minutes it saves on a documentation-only change.
  test:
    runs-on: ubuntu-latest
    needs: changes
    # Nothing in the suite reads docs/ or .claude/ — checked, not assumed: the
    # only repo files any test opens are .github/workflows/build.yml and
    # Lightbox.App.csproj, both read by CiRuntimeTests, and both count as *code*
    # under the filter below. So a workflow edit still runs the tests written to
    # guard workflow edits, while a BUGS.md edit does not run 2451 tests that
    # cannot see it.
    #
    # The job is skipped rather than removed, so it still reports a conclusion
    # and a required-check rule has something to read.
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # One line now, and that is the point of the upgrade rather than an
          # oversight — see docs/DESIGN-net10-upgrade.md.
          #
          # The solution targets net10.0 throughout, so the SDK that builds it
          # carries the runtime that runs it and there is nothing left to
          # declare separately. This used to name 8.0.x as well, because a
          # net8.0 test assembly does not roll forward onto a 10.0 runtime
          # (RollForward defaults to Minor, which will not cross a major
          # version) — so the 10.0 SDK alone compiled everything and then ran
          # not one test. B53 was that dependency being inherited from the
          # ubuntu-latest image rather than declared here; moving the TFM
          # retires the requirement instead of declaring it.
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keyed on the project files rather than a lock file, because this
          # repo has none — `setup-dotnet`'s own `cache: true` needs a
          # packages.lock.json and fails with "unable to cache dependencies"
          # without one. Hashing the csproj set plus Directory.Build.props gets
          # the same effect: the key moves exactly when a dependency or a target
          # framework does.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          # A partial hit still saves most of the download: the restore only
          # fetches what changed rather than the whole graph.
          restore-keys: nuget-${{ runner.os }}-
      - name: SkiaSharp native dependency
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1
      - run: dotnet test Lightbox.sln -c Release
      # The branch-name rules in branchstate.py have no C# suite to live in, and
      # a heuristic with no test is how the first version came to fire on
      # `chore/ledger-by-domain`. Costs a second.
      - name: Branch-name rules
        run: python3 scripts/branchstate.py selftest

  # The derived documentation checks.
  #
  # A SEPARATE job rather than a step in `test`, and the reason is the `if:`
  # above it: `test` is skipped when a push touches only docs/ and .claude/ —
  # which is precisely when the manual's contents list drifts. A check that
  # cannot run on a documentation-only change is not a check on documentation.
  #
  # No .NET and no checkout depth needed, so it costs a few seconds and runs on
  # everything.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The manual's contents list matches its sections
        run: python3 scripts/manual.py check

  # Is there anything in this push that could change the bundle? A Windows
  # build of a Markdown edit is 105 MB of storage for a file nobody ships.
  # Tests still run on everything — it is only the bundle that is skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A new branch, a force push or a first run has no usable base.
          # Build in that case: skipping a bundle somebody wanted is a worse
          # failure than storing one they did not.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref — building"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          printf '%s\n' "$CHANGED"
          # Anything that is not documentation counts as code.
          if printf '%s\n' "$CHANGED" | grep -qvE '^(docs/|\.claude/)|^[^/]*\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only — skipping the Windows bundle"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  publish-win-x64:
    runs-on: ubuntu-latest
    needs: [test, changes]
    # One condition now, and losing the second one is the point rather than an
    # oversight.
    #
    # It used to also skip same-repo pull requests, because `push` and
    # `pull_request` both fired and produced two bundles under different names —
    # a PR's SHA is the merge commit, so neither replaced the other. Narrowing
    # `push` to the default branch removes the duplicate at its source, and it
    # turns that guard from redundant into **wrong**: a feature branch's only
    # event is now the pull_request, so excluding it would mean no branch ever
    # produced a bundle again. The README tells people to download
    # `branch-<name>-…` artifacts, so that would have been a silent removal of a
    # documented workflow.
    #
    # What remains is the documentation-only skip: a Windows build of a Markdown
    # edit is 105 MB of quota for a file nobody ships.
    if: >
      needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keyed on the project files rather than a lock file, because this
          # repo has none — `setup-dotnet`'s own `cache: true` needs a
          # packages.lock.json and fails with "unable to cache dependencies"
          # without one. Hashing the csproj set plus Directory.Build.props gets
          # the same effect: the key moves exactly when a dependency or a target
          # framework does.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          # A partial hit still saves most of the download: the restore only
          # fetches what changed rather than the whole graph.
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish app (self-contained, no install/admin needed)
        run: >
          dotnet publish src/Lightbox.App/Lightbox.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishTrimmed=false -p:DebugType=none
          -o publish/win-x64
      # Into the SAME folder as the app, not a subfolder — that is B32's fix and
      # it is the net10.0 upgrade that made it possible. A self-contained app
      # only looks for its runtime beside its own executable, so `mcp/` could
      # never reach the parent's copy and had to carry a second one: 35.3 MB of
      # a 105 MB bundle. While the app was net8.0 and the server net10.0 those
      # two copies were genuinely different files and merging them would have
      # broken whichever executable lost. Both are net10.0 now, so the runtime
      # files are byte-identical, the second publish overwrites them with the
      # same bytes, and the two deps.json/runtimeconfig.json pairs have distinct
      # names and coexist. Measured: the server adds 4 MB instead of 35.3, and
      # the bundle drops from 105 MB zipped to 74.
      - name: Publish MCP server into the same bundle
        run: >
          dotnet publish src/Lightbox.Mcp/Lightbox.Mcp.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishTrimmed=false -p:DebugType=none
          -o publish/win-x64
      # The artifact (= downloaded zip) name says what kind of build this is:
      #   release-main-…      build of main, for release-style testing
      #   bugfix-<branch>-…   build of a fix/, bugfix/ or hotfix/ branch
      #   branch-<branch>-…   any other feature/work branch
      # plus the short commit SHA so builds of the same branch stay distinguishable.
      - name: Artifact designation
        id: designation
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$BRANCH" in
            main)                    KIND="release" ;;
            fix/*|bugfix/*|hotfix/*) KIND="bugfix" ;;
            *)                       KIND="branch" ;;
          esac
          SAFE=$(printf '%s' "$BRANCH" | tr '/ _' '---' | tr -cd 'A-Za-z0-9.-')
          echo "prefix=Lightbox-win-x64-${KIND}-${SAFE}-" >> "$GITHUB_OUTPUT"
          echo "name=Lightbox-win-x64-${KIND}-${SAFE}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ---- keep the quota from filling ------------------------------------------
      #
      # One bundle is ~105 MB zipped, so `retention-days` alone cannot hold the
      # line: retention is time-based and the accumulation here is per-push.
      #
      # It runs BEFORE the upload on purpose. Pruning afterwards deadlocks —
      # once the quota is full the upload fails, and the step that would have
      # freed the space never runs.
      #
      # The policy lives in .github/scripts/prune-artifacts.sh so the cleanup
      # button runs exactly the same rules. HEADROOM_MB is the one thing only
      # this caller wants: leave room for the bundle about to be uploaded.
      - name: Prune older artifacts before uploading
        continue-on-error: true       # never fail a build over housekeeping
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 3
          STALE_DAYS: 7
          # 400, not 1500. A Free personal account's whole artifact allowance
          # is 500 MB; Pro is 2 GB. A budget above the ceiling never fires, so
          # this is sized for the smaller plan — raise it to ~1500 on Pro.
          BUDGET_MB: 400
          HEADROOM_MB: 200
        shell: bash
        run: bash .github/scripts/prune-artifacts.sh

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.designation.outputs.name }}
          path: publish/win-x64
          # Work builds are throwaway; only main's are worth keeping around.
          #
          # compression-level is left at its default deliberately. Measured on
          # this bundle: 104.8 MB at level 6 against 104.4 MB at level 9,
          # because it is already compressed DLLs and native libraries.
          # Raising it costs CPU on every run to save 0.4%.
          retention-days: ${{ github.ref_name == 'main' && 30 || 5 }}
