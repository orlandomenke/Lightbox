name: cleanup artifacts

# A button in the Actions tab, for when the storage quota has filled and the
# build workflow's own prune cannot rescue it — once the quota is full an
# upload fails, and the prune that runs beside an upload never gets the chance.
# This runs on its own, builds nothing, and takes about ten seconds.
#
# Actions ▸ cleanup artifacts ▸ Run workflow.
#
# NOTE: workflow_dispatch only shows a Run workflow button when this file is on
# the repository's DEFAULT branch. On a feature branch it is invisible, however
# correct it is.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'Newest bundles to keep per branch (0 deletes every one)'
        default: '3'
      stale_days:
        description: 'Also delete feature-branch bundles older than N days (0 to skip)'
        default: '7'
      budget_mb:
        description: 'Ceiling for total storage — oldest go first until it fits (0 to skip)'
        default: '400'
      dry_run:
        description: 'List what would go without deleting anything'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Only the script is needed, so keep the checkout shallow and sparse.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep }}
          STALE_DAYS: ${{ inputs.stale_days }}
          BUDGET_MB: ${{ inputs.budget_mb }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: bash .github/scripts/prune-artifacts.sh
